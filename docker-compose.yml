services:
  postgres:
    image: postgres:17-alpine
    container_name: webhookdelivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook_dev_pw
      POSTGRES_DB: webhookdelivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhookdelivery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
